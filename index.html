<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b16">
<title>Tahazit</title>
<meta name="description" content="Compare weather forecasts from the world's leading models in one place, with consensus-based storm alerts.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#070b16;--bg2:#0d1426;--card:#111a30;--card2:#16213d;--line:#22305a;
  --txt:#e8eefc;--mut:#8e9cc4;--acc:#4f9cf9;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif}
body{background:none;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f9cf9,#a78bfa);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 20px #4f9cf955}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:13px 44px 13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:20;display:none}
.sugg button{display:block;width:100%;text-align:right;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:inherit;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:#1d2a4d}
.sugg small{color:var(--mut)}
.locbtn{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:16px;cursor:pointer;text-align:right}
.locbtn:hover{border-color:var(--acc)}
.locbtn .nm2{flex:1;font-weight:700}
.locbtn .tag{font-size:11.5px;color:#6ee7a0;background:#22c55e1c;padding:2px 8px;border-radius:999px;font-weight:500}
.locbtn .chg{font-size:13px;color:#9cc3ff}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:11px 13px;border-radius:13px;background:#4f9cf914;border:1px solid #4f9cf955;font-size:14px}
.banner .txt{flex:1;min-width:180px}
.banner[hidden]{display:none}
.btn{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:0 4px}
.sheet input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:16px;outline:none}
.sheet input:focus{border-color:var(--acc)}
.list{overflow:auto;border-radius:13px;border:1px solid var(--line);min-height:60px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:inherit;font-size:15px;cursor:pointer}
.opt:last-child{border-bottom:0}
.opt:hover,.opt.act{background:#1d2a4d}
.opt.sel{background:#4f9cf922;outline:2px solid var(--acc);outline-offset:-2px}
.opt small{display:block;color:var(--mut);font-size:12px}
.opt .ck{margin-inline-start:auto;color:var(--acc);font-size:18px;visibility:hidden}
.opt.sel .ck{visibility:visible}
.hint{color:var(--mut);font-size:13px;padding:14px;text-align:center}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:11px;border-radius:13px;background:#4f9cf914;border:1px solid #4f9cf955}
.confirm.show{display:flex}
.confirm .txt{flex:1;font-size:14px;min-width:160px}
.row-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.card{background:rgba(13,20,40,.62);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.place{font-size:20px;font-weight:700}
.updated{color:var(--mut);font-size:12px;margin-top:2px}
.bigt{font-size:64px;font-weight:300;line-height:1}
.bigt sup{font-size:26px;vertical-align:top}
.cond{font-size:16px;margin-top:6px}
.rangeline{color:var(--mut);font-size:13px;margin-top:6px}
.rainline{display:flex;gap:12px;align-items:center}
.rainline .e{font-size:30px}
.rainline b{display:block;font-size:17px;line-height:1.4}
.rainline span{color:var(--mut);font-size:13px}
.qa{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0;padding-bottom:0}
.qa .e{font-size:22px}
.qa b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qa span.t{color:#c9d3ef;font-size:13.5px;display:block;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.pill.hi{background:#22c55e22;color:#6ee7a0}.pill.md{background:#f59e0b22;color:#fcd34d}.pill.lo{background:#ef444422;color:#fca5a5}
.now-models{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.nm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.alerts .al{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;margin-bottom:8px;border:1px solid}
.al.red{background:#ef444414;border-color:#ef444455}
.al.orange{background:#f59e0b14;border-color:#f59e0b55}
.al.green{background:#22c55e10;border-color:#22c55e40}
.al b{display:block;margin-bottom:2px}
.al span{color:#c9d3ef;font-size:13px}
h2{font-size:16px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:62px 34px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.day:hover{border-color:#3a4f8a}
.day .dn{font-weight:700}.day .dd{color:var(--mut);font-size:11.5px}
.day .ico{font-size:24px;text-align:center}
.day .sum{font-size:13px;line-height:1.5}
.day .sum .m{color:var(--mut)}
.day .tt{text-align:left;white-space:nowrap}
.day .tt b{font-size:17px}.day .tt span{color:var(--mut);font-size:14px}
.bar{height:6px;border-radius:4px;background:#22305a;position:relative;margin-top:5px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(90deg,#60a5fa,#3b82f6);border-radius:4px}
.detail{display:none;grid-column:1/-1;margin-top:8px}
.day.open .detail{display:block}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#0c1324;color:var(--mut);font-weight:500;position:sticky;top:0}
td.l,th.l{text-align:right;position:sticky;right:0;background:#0f1730;z-index:1}
tr:last-child td{border-bottom:0}
.cons{background:#4f9cf914;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:5px}
.models-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.mi b{display:flex;align-items:center;gap:6px}
.mi span{color:var(--mut);font-size:12px}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px;line-height:1.8}
footer a{color:#9cc3ff;text-decoration:none}
.made{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:500}
.shield{width:18px;height:18px}
.loading{text-align:center;padding:50px 0;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.9s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#ef444418;border:1px solid #ef444455;padding:14px;border-radius:14px}
@media (max-width:560px){
  .bigt{font-size:54px}
  .day{grid-template-columns:52px 28px 1fr auto;gap:8px;padding:9px}
  .day .sum{font-size:12px}
}

html,body{font-family:Heebo,system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans JP","PingFang SC","Hiragino Sans",sans-serif}
img.logo{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 20px #4f9cf955}
.gear{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer}
.gear:hover{border-color:var(--acc)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.fld select{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:15px}
footer .made{cursor:default}
[dir=ltr] .locbtn,[dir=ltr] .opt{text-align:left}
.opt .ck{margin-inline-start:auto}
.alertsBox{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.tgl{display:flex;align-items:center;gap:10px;color:var(--txt);font-size:15px;cursor:pointer}
.tgl input{width:20px;height:20px;accent-color:var(--acc)}
.alertsBox small{color:var(--mut);font-size:12.5px;line-height:1.5}
.amsg{font-size:13px;color:#6ee7a0;min-height:0}
.amsg.err{color:#fca5a5}
footer a.pp{color:#9cc3ff}


/* ===== v2: dynamic sky ===== */
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--sk);transition:background 1.5s}
.sky.night{--sk:linear-gradient(180deg,#020617 0%,#0b1a3a 55%,#1e1b4b 100%)}
.sky.dawn{--sk:linear-gradient(180deg,#1e1b4b 0%,#7c2d64 45%,#f59e0b 100%)}
.sky.day{--sk:linear-gradient(180deg,#1e3a8a 0%,#2f6fd6 45%,#7cc4f5 100%)}
.sky.dusk{--sk:linear-gradient(180deg,#1e1b4b 0%,#9d174d 50%,#f97316 100%)}
#sky::after{content:"";position:absolute;inset:0;background:#1f2937;opacity:0;transition:opacity 1.5s}
.sky.wx-cloudy::after{opacity:.45}.sky.wx-rain::after{opacity:.62}.sky.wx-storm::after{opacity:.78;background:#111827}
.sky.wx-fog::after{opacity:.5;background:#64748b}.sky.wx-snow::after{opacity:.4;background:#475569}.sky.wx-partly::after{opacity:.12}
.stars{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;transition:opacity 1.5s;animation:tw 4s ease-in-out infinite alternate}
.sky.night.wx-clear .stars,.sky.night.wx-partly .stars{opacity:1}
@keyframes tw{from{filter:brightness(.7)}to{filter:brightness(1.3)}}
.moon{position:absolute;top:9vh;inset-inline-start:12vw;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e5e7eb 60%,#cbd5e1);box-shadow:0 0 40px 10px #fef3c722;opacity:0;transition:opacity 1.5s}
.sky.night.wx-clear .moon,.sky.night.wx-partly .moon{opacity:.95}
.sun{position:absolute;top:7vh;inset-inline-start:10vw;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff7cc 0%,#fde68a 35%,#f59e0b 70%,transparent 72%);box-shadow:0 0 120px 50px #fbbf2455;opacity:0;transition:opacity 1.5s,top 1.5s;animation:sunp 6s ease-in-out infinite alternate}
.sky.day.wx-clear .sun,.sky.day.wx-partly .sun{opacity:1}
.sky.dawn.wx-clear .sun,.sky.dawn.wx-partly .sun,.sky.dusk.wx-clear .sun,.sky.dusk.wx-partly .sun{opacity:.9;top:46vh}
@keyframes sunp{from{transform:scale(1)}to{transform:scale(1.06)}}
.cl{position:absolute;height:70px;width:220px;border-radius:70px;background:#fff;opacity:0;filter:blur(2px);transition:opacity 1.5s,background 1.5s;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:110px;height:110px;top:-55px;left:30px}.cl::after{width:80px;height:80px;top:-35px;left:120px}
.c1{top:16vh;animation-duration:95s;animation-delay:-20s}.c2{top:30vh;transform:scale(.75);animation-duration:130s;animation-delay:-70s}.c3{top:8vh;transform:scale(1.2);animation-duration:160s;animation-delay:-110s}
@keyframes drift{from{left:-260px}to{left:110vw}}
.sky.wx-partly .c1,.sky.wx-partly .c2{opacity:.55}
.sky.wx-cloudy .cl,.sky.wx-rain .cl,.sky.wx-snow .cl{opacity:.5;background:#cbd5e1}
.sky.wx-storm .cl{opacity:.55;background:#64748b}
.sky.night .cl{background:#94a3b8}.sky.night.wx-partly .cl{opacity:.25}
.fogl{position:absolute;inset:0;background:linear-gradient(0deg,rgba(226,232,240,.35),transparent 60%);opacity:0;transition:opacity 1.5s}
.sky.wx-fog .fogl{opacity:1}
#wxc{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#e0e7ff;opacity:0}
.sky.wx-storm .flash{animation:flash 9s infinite}
@keyframes flash{0%,93%,100%{opacity:0}94%{opacity:.35}95%{opacity:.05}96%{opacity:.25}97%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cl,.stars,.sun,.flash{animation:none!important}.sky.wx-storm .flash{opacity:0}}
.sheet{background:rgba(13,20,38,.97)}

/* ===== v2: model choice ===== */
.nm.addm{cursor:pointer;color:#9cc3ff;border-style:dashed;font:inherit;font-size:12px}
.nm.addm:hover{border-color:var(--acc)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.mrow .mn{flex:1;display:flex;flex-direction:column}.mrow .mn small{color:var(--mut);font-size:12px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}.mbtns .btn{flex:1}

/* ===== v2: storm outlook ===== */
.stbtn{width:100%;margin:2px 0 12px;font-weight:700;background:linear-gradient(135deg,#4c1d95,#1e40af);border-color:#6d28d9;color:#fff;padding:12px}
.sheet.wide{max-width:760px;overflow:auto}
table.stg{min-width:0;table-layout:fixed;text-align:center;font-size:12px}
table.stg th,table.stg td{padding:6px 2px}
table.stg th:first-child,table.stg td:first-child{width:86px;text-align:start;padding-inline-start:8px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.stg th{font-size:11px;font-weight:600;white-space:normal;line-height:1.25}
table.stg th small{color:var(--mut);font-weight:400}
.stg td.sc{cursor:pointer;height:40px;font-size:15px;border:2px solid transparent;transition:transform .15s}
.stg td.sc:hover{transform:scale(1.06)}
.stg td.sel{border-color:#fff}
.sc.ok,.sw.ok{background:#16213d}.sc.rn,.sw.rn{background:#1d4ed855}.sc.wd,.sw.wd{background:#f59e0b66}.sc.hv,.sw.hv{background:#ef444477}.sc.th,.sw.th{background:#7c3aed99}.sc.na{background:transparent;color:var(--mut)}
.agr-hi{color:#fca5a5;font-weight:800}.agr-md{color:#fcd34d}
.stdet{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;line-height:1.6}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.st-leg{margin-top:10px}

/* ===== v2: update banner ===== */
.upd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;background:#111a30f2;border:1px solid var(--acc);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px #0008;font-size:14px;max-width:92vw}
</style>
</head>
<body>
<div id="sky" class="sky night wx-clear" aria-hidden="true">
  <div class="stars"></div><div class="moon"></div><div class="sun"></div>
  <div class="cl c1"></div><div class="cl c2"></div><div class="cl c3"></div><div class="fogl"></div>
  <canvas id="wxc"></canvas><div class="flash"></div>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="icons/icon-192.png" alt="">
      <div><h1 data-i18n="appName"></h1><small data-i18n="tagline"></small></div>
    </div>
    <button class="gear" id="gear" data-ta="settings">⚙️</button>
  </header>

  <div class="search">
    <button class="locbtn" id="locBtn" data-ta="pickTitle">
      <span>📍</span><span class="nm2" id="locName"></span>
      <span class="tag" id="locTag" data-i18n="autoTag" hidden></span><span class="chg" data-i18n="change"></span>
    </button>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="ov" id="ov" role="dialog" aria-modal="true">
    <div class="sheet">
      <h3><span data-i18n="pickTitle"></span> <button class="x" id="close" data-ta="done">×</button></h3>
      <button class="btn" id="geo" data-i18n="detectBtn"></button>
      <input id="q" type="search" data-tp="searchPh" autocomplete="off" enterkeyhint="search">
      <div class="list" id="list"></div>
      <div class="confirm" id="confirm">
        <div class="txt" id="confirmTxt"></div>
        <button class="btn" id="back" data-i18n="back"></button>
        <button class="btn pri" id="ok" data-i18n="confirm"></button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovS" role="dialog" aria-modal="true">
    <div class="sheet">
      <h3><span data-i18n="settings"></span> <button class="x" id="closeS" data-ta="done">×</button></h3>
      <label class="fld"><span data-i18n="language"></span><select id="selLang"></select></label>
      <label class="fld"><span data-i18n="units"></span><select id="selUnits"></select></label>
      <div class="fld alertsBox">
        <label class="tgl"><input type="checkbox" id="alertsTgl"><span data-i18n="alertsOpt"></span></label>
        <small data-i18n="alertsOptSub"></small>
        <div id="alertsMsg" class="amsg"></div>
        <button class="btn" id="alertsTest" data-i18n="testBtn" hidden></button>
      </div>
      <button class="btn pri" id="doneS" data-i18n="sDone" style="width:100%;margin-top:6px"></button>
    </div>
  </div>

alertsSub:['התראה אדומה או כתומה מוצגת כשרוב המודלים מסכימים. כשרק חלק מהמודלים צופים סופה, היא מסומנת כסימן ראשון.','Red or orange alerts appear when most models agree. When only some models forecast a storm, it is shown as an early sign.','تظهر التنبيهات الحمراء أو البرتقالية عندما تتفق معظم النماذج. وعندما تتوقع بعض النماذج فقط عاصفة، تُعرض كإشارة مبكرة.','Красные и оранжевые предупреждения появляются, когда большинство моделей согласны. Если бурю прогнозируют лишь некоторые модели, это показано как ранний признак.','当多数模型一致时显示红色或橙色预警；仅部分模型预报风暴时，显示为早期信号。','多くのモデルが一致すると赤・オレンジの警報を表示します。一部のモデルのみが嵐を予測する場合は「初期の兆候」として表示します。'],

daysSub:['ציון הביטחון הוא הערכה לפי הפער בין המודלים והמרחק בימים, ולא הסתברות סטטיסטית. לחיצה על יום פותחת את הטבלה של כל מודל.','The confidence score is an estimate based on model spread and lead time, not a statistical probability. Tap a day to see each model.','درجة الثقة تقدير يعتمد على تباين النماذج وبُعد اليوم، وليست احتمالًا إحصائيًا. اضغط على يوم لعرض كل نموذج.','Показатель уверенности оценивается по разбросу моделей и дальности прогноза и не является статистической вероятностью. Нажмите на день, чтобы увидеть каждую модель.','可信度是根据模型差异和预报时效得出的估计值，并非统计概率。点击某一天可查看各模型详情。','信頼度はモデル間の差と予報日数に基づく目安で、統計的な確率ではありません。日付をタップすると各モデルを表示します。'],

alertsSub:["Une alerte rouge ou orange s'affiche quand la plupart des modèles sont d'accord. Si seuls certains prévoient une tempête, c'est un premier signal.","Rote oder orange Warnungen erscheinen, wenn die meisten Modelle übereinstimmen. Sagen nur einige ein Unwetter voraus, wird es als erstes Anzeichen gezeigt.","Las alertas rojas o naranjas aparecen cuando la mayoría de los modelos coinciden. Si solo algunos prevén tormenta, se muestra como primer indicio.","Gli avvisi rossi o arancioni compaiono quando la maggior parte dei modelli concorda. Se solo alcuni prevedono un temporale, viene mostrato come primo segnale.","Os alertas vermelhos ou laranja aparecem quando a maioria dos modelos concorda. Se só alguns preveem tempestade, surge como primeiro sinal.","Rode of oranje waarschuwingen verschijnen als de meeste modellen het eens zijn. Als slechts enkele een storm voorspellen, wordt dat als eerste signaal getoond.","Czerwone lub pomarańczowe ostrzeżenia pojawiają się, gdy większość modeli się zgadza. Gdy burzę prognozują tylko niektóre, pokazujemy to jako pierwszy sygnał.","Червоні або помаранчеві попередження з'являються, коли більшість моделей згодні. Якщо бурю прогнозують лише деякі моделі, це показано як ранню ознаку."],

daysSub:["L'indice de confiance est une estimation fondée sur l'écart entre modèles et l'échéance, pas une probabilité statistique. Touchez un jour pour voir chaque modèle.","Die Sicherheit ist eine Schätzung aus Modellabweichung und Vorhersagezeitraum, keine statistische Wahrscheinlichkeit. Tippen Sie auf einen Tag, um jedes Modell zu sehen.","La confianza es una estimación basada en la diferencia entre modelos y la antelación, no una probabilidad estadística. Toca un día para ver cada modelo.","L'affidabilità è una stima basata sulla differenza tra modelli e sull'anticipo, non una probabilità statistica. Tocca un giorno per vedere ogni modello.","A confiança é uma estimativa baseada na diferença entre modelos e na antecedência, não uma probabilidade estatística. Toque num dia para ver cada modelo.","De zekerheid is een schatting op basis van spreiding tussen modellen en de vooruitlooptijd, geen statistische kans. Tik op een dag om elk model te zien.","Pewność to szacunek oparty na rozrzucie modeli i odległości w czasie, a nie prawdopodobieństwo statystyczne. Dotknij dnia, aby zobaczyć każdy model.","Впевненість оцінюється за розкидом моделей і дальністю прогнозу та не є статистичною ймовірністю. Натисніть на день, щоб побачити кожну модель."],

chartSub:["Chaque ligne est un modèle. La ligne blanche en pointillés est la moyenne. Plus les lignes s'écartent, moins la prévision est sûre.","Jede Linie ist ein Modell. Die weiße gestrichelte Linie ist der Mittelwert. Je weiter die Linien auseinanderliegen, desto unsicherer die Prognose.","Cada línea es un modelo. La línea blanca discontinua es la media. Cuanto más se separan las líneas, menos segura es la previsión.","Ogni linea è un modello. La linea bianca tratteggiata è la media. Più le linee si allontanano, meno è sicura la previsione.","Cada linha é um modelo. A linha branca tracejada é a média. Quanto mais as linhas se afastam, menos certa é a previsão.","Elke lijn is een model. De witte stippellijn is het gemiddelde. Hoe verder de lijnen uiteenlopen, hoe onzekerder de verwachting.","Każda linia to model. Biała przerywana linia to średnia. Im bardziej linie się rozchodzą, tym mniej pewna prognoza.","Кожна лінія відповідає моделі. Біла пунктирна лінія показує середнє. Що більше лінії розходяться, то менш надійний прогноз."],

// geo/cities15000.json: [[name, lat, lon, countryCode], ...], GeoNames (CC BY 4.0), built by tools/make_geo.js.
function geoKm(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function nearestIn(list,lat,lon){
  let best=null,bd=Infinity;
  if(!Array.isArray(list))return {c:null,d:bd};
  for(const c of list){
    if(Math.abs(c[1]-lat)>1)continue; // cheap prefilter, 1 degree is about 111 km
    const d=geoKm(lat,lon,c[1],c[2]);if(d<bd){bd=d;best=c}
  }
  return {c:best,d:bd};
}
// Returns the place name to show. o: {lang, cities (Hebrew list), geo (list or null), lat, lon, t (translate fn)}
function resolveName(o){
  const he=o.lang==='he';
  const hc=he?nearestIn(o.cities,o.lat,o.lon):{c:null,d:Infinity};
  if(he&&hc.d<=4)return hc.c[0];
  if(he&&hc.d<=15)return o.t('near',{p:hc.c[0]});
  const g=nearestIn(o.geo,o.lat,o.lon);
  if(g.c&&g.d<=15)return g.c[0];
  if(g.c&&g.d<=40)return o.t('near',{p:g.c[0]});
  return o.t('myLoc');
}

// ===== Pure calculation helpers (no DOM, no globals). Tested by tests/calc.test.js =====
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
// Strict majority of n models, never fewer than 2 (4 models need 3, 5 need 3, 2 need 2). Same rule in server/alerts_lib.php.
const needFor=n=>Math.max(2,Math.floor(n/2)+1);
// s = {n: models that have a value, k: models that cross the threshold}. With a single selected model, that model decides.
const majority=s=>s.n>0&&s.k>=(s.n===1?1:needFor(s.n));

// Consensus of the models' values for one moment. Outlier: differs from the median of the others by 3 or more (needs 3 others).
// If fewer than 2 values would be left after filtering, nothing is filtered, the median of all is used and disagree=true.
// Returns {empty,med,min,max,inMin,inMax,out:[bool per input],disagree}.
function consensus(vals){
  const v=vals.map(x=>x==null?NaN:+x),ok=v.filter(Number.isFinite);
  if(!ok.length)return {empty:true,med:null,min:null,max:null,inMin:null,inMax:null,out:v.map(()=>false),disagree:false};
  // compare each value with the others (by position, so equal values are handled correctly)
  const idx=v.map((x,i)=>Number.isFinite(x)?i:-1).filter(i=>i>=0);
  let out=v.map((x,i)=>{
    if(!Number.isFinite(x))return false;
    const others=idx.filter(j=>j!==i).map(j=>v[j]);
    return others.length>=3&&Math.abs(x-med(others))>=3;
  });
  let disagree=false;
  let inl=idx.filter(i=>!out[i]);
  if(inl.length<2&&ok.length>=2){out=out.map(()=>false);inl=idx;disagree=true}
  const iv=inl.map(i=>v[i]);
  return {empty:false,med:med(iv),min:Math.min(...ok),max:Math.max(...ok),inMin:Math.min(...iv),inMax:Math.max(...iv),out,disagree};
}

// Per-day counts from the per-model rows [{max,min,rain,gust,code,cape}] (a missing value is null/undefined).
// A model with no value for a hazard is not counted in that hazard's denominator (n*), it does not count as "0".
function dayCounts(per){
  const has=k=>per.filter(x=>x[k]!=null);
  const rains=has('rain'),gusts=has('gust');
  const thunderPer=per.filter(x=>x.code!=null||x.cape!=null);
  return {
    nRain:rains.length,rainN:rains.filter(x=>x.rain>=1).length,heavyN:rains.filter(x=>x.rain>=20).length,
    rainAvg:rains.length?avg(rains.map(x=>x.rain)):0,rainMax:rains.length?Math.max(...rains.map(x=>x.rain)):0,
    nWind:gusts.length,windN:gusts.filter(x=>x.gust>=60).length,gustMax:gusts.length?Math.max(...gusts.map(x=>x.gust)):0,
    nThunder:thunderPer.length,thunderN:thunderPer.filter(x=>(x.code>=95)||(x.cape!=null&&x.cape>=1000&&(x.rain??0)>=1)).length

}

const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  const off=(state.data&&state.data.utc_offset_seconds)||0;

  for(const m of MODELS){const a=pick(D,'sunrise',m.id),b=pick(D,'sunset',m.id);if(a&&a[di]&&b&&b[di]){sr=a[di];ss=b[di];break}}

  if(kind===pKind)return;pKind=kind;cancelAnimationFrame(pRAF);
  const ctx=cv.getContext('2d');
  const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();onresize=fit;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!kind)return;
  const N=kind==='storm'?170:kind==='rain'?90:70;
  const ps=Array.from({length:N},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:kind==='snow'?0.6+Math.random()*1.2:9+Math.random()*7,l:10+Math.random()*12,w:Math.random()*6}));
  const step=()=>{
    pRAF=requestAnimationFrame(step);
    if(document.hidden)return;
    ctx.clearRect(0,0,cv.width,cv.height);
    if(kind==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';
      for(const p of ps){p.y+=p.v;p.w+=.02;p.x+=Math.sin(p.w)*.6;if(p.y>cv.height){p.y=-5;p.x=Math.random()*cv.width}
        ctx.beginPath();ctx.arc(p.x,p.y,1.6+p.v*.6,0,6.283);ctx.fill()}}
    else{ctx.strokeStyle='rgba(174,214,255,.45)';ctx.lineWidth=1.2;ctx.beginPath();
      for(const p of ps){p.y+=p.v;p.x-=p.v*.18;if(p.y>cv.height){p.y=-p.l;p.x=Math.random()*(cv.width+100)}
        ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.l*.18,p.y-p.l)}ctx.stroke()}
  };
  step();
}

function navLangs(){const a=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);return a.map(x=>String(x))}
function detectLang(){for(const l of navLangs()){let p=l.toLowerCase().split(/[-_]/)[0];if(p==='iw')p='he';if(L.includes(p))return p}return 'en'}
// אזור "אמריקאי" נקבע רק אם גם הגדרת האזור וגם אזור הזמן מתאימים (הרבה מחשבים בישראל מוגדרים en-US).
// התוצאה נשמרת בפעם הראשונה, כך שמי שטס לחו"ל ממשיך לקבל את אותן יחידות.
function detectImperial(){
  const saved=load('mm_units_det');if(saved==='imperial'||saved==='metric')return saved==='imperial';
  const IMP=['US','LR','MM','PR','GU','VI','AS','MP','UM','BS','BZ','KY','PW','FM','MH'];
  let region='';
  for(const l of navLangs()){const m=l.match(/[-_]([A-Za-z]{2})\b/);if(m){region=m[1].toUpperCase();break}}
  if(!region){try{region=new Intl.Locale(Intl.DateTimeFormat().resolvedOptions().locale).maximize().region||''}catch(e){}}
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  const tzOk=!tz||/^(America|Pacific|US)\//.test(tz)||tz==='Africa/Monrovia'||tz==='Asia/Yangon'||tz==='Asia/Rangoon';
  const imp=IMP.includes(region)&&tzOk;
  store('mm_units_det',imp?'imperial':'metric');
  return imp;
}

const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

function fmtH(iso){const h=+iso.slice(11,13),m=iso.slice(14,16);if(!U.imp)return iso.slice(11,16);return (h%12||12)+(m!=='00'?':'+m:'')+(h<12?' AM':' PM')}
function wd(dateStr,style){try{return new Intl.DateTimeFormat(LOC,{weekday:style,timeZone:'UTC'}).format(new Date(dateStr+'T12:00:00Z'))}catch(e){return dateStr}}
function dayRef(dateStr,i){return i===0?t('today'):i===1?t('tomorrow'):t('onDay',{d:wd(dateStr,'long')})}
function dayLabel(dateStr,i){return cap(i===0?t('today'):i===1?t('tomorrow'):wd(dateStr,'long'))}

async function fetchObs(p){

function pick(obj,key,id){return obj[`${key}_${id}`]||null}

function process(d,ids){
  const H=d.hourly,D=d.daily;
  const models=MODELS.filter(m=>(!ids||ids.includes(m.id))&&(()=>{const a=pick(H,'temperature_2m',m.id);return a&&a.some(v=>v!==null)})());
  const nowLocal=new Date(Date.now()+d.utc_offset_seconds*1000).toISOString().slice(0,13);
  let ni=H.time.findIndex(x=>x.slice(0,13)===nowLocal); if(ni<0)ni=0;
  const days=D.time.map((tm,i)=>{
    const per=models.map(m=>({m,
      max:pick(D,'temperature_2m_max',m.id)?.[i],min:pick(D,'temperature_2m_min',m.id)?.[i],
      rain:pick(D,'precipitation_sum',m.id)?.[i],gust:pick(D,'wind_gusts_10m_max',m.id)?.[i],
      code:pick(D,'weather_code',m.id)?.[i],
      cape:(()=>{const c=pick(H,'cape',m.id);if(!c)return null;const s=c.slice(i*24,i*24+24).filter(v=>v!==null);return s.length?Math.max(...s):null})()
    })).filter(x=>x.max!=null);
    const n=per.length;
    const maxs=per.map(x=>x.max),mins=per.map(x=>x.min);
    const dc=dayCounts(per);
    const codes=per.map(x=>x.code).filter(c=>c!=null).sort((a,b)=>a-b);
    return {idx:i,date:tm,per,n,max:n?avg(maxs):null,min:n?avg(mins):null,...dc,
      spread:n?Math.max(...maxs)-Math.min(...maxs):0,
      code:codes.length?codes[Math.floor(codes.length/2)]:0};
  });
  return {models,ni,days,H,D};
}

function conf(d){
  if(!d.n)return 0;
  const p=d.nRain?d.rainN/d.nRain:0;
  let c=100-Math.min(40,d.spread*7)-(1-Math.abs(2*p-1))*35-(d.idx||0)*3;
  if(d.n<3)c-=10;
  return Math.max(30,Math.min(97,Math.round(c)));
}
function agree(day){const c=conf(day);return [c>=80?'hi':c>=60?'md':'lo',t('conf',{n:c})]}

function hourStats(P,i,key,thr){
  const v=P.models.map(m=>(pick(P.H,key,m.id)||[])[i]).filter(x=>x!=null);
  return {n:v.length,k:v.filter(x=>x>=thr).length,mean:v.length?avg(v):null};
}
function dph(P,i){return dayRef(P.H.time[i].slice(0,10),Math.floor(i/24))}

function rainLine(P){
  const T=P.H.time,end=Math.min(P.ni+72,T.length);
  const rs=i=>hourStats(P,i,'precipitation',0.2);
  let st=-1;
  for(let i=P.ni;i<end;i++){if(majority(rs(i))){st=i;break}}
  if(st<0){
    for(let i=P.ni;i<end;i++){const s=rs(i);if(s.k>=1)return ['🌦️',t('mostNo'),t('onlyK',{k:s.k,n:s.n,d:dph(P,i),t:fmtH(T[i])})]}
    return ['☀️',t('noRain3'),t('noneModel')];
  }
  let en=st,gap=0,kmax=0,nn=0;
  for(let i=st;i<T.length;i++){const s=rs(i);
    if(majority(s)){en=i;gap=0;if(s.k>kmax){kmax=s.k;nn=s.n}}else if(++gap>2)break}
  let sum=0;for(let i=st;i<=en;i++)sum+=rs(i).mean||0;
  const e=T[en+1];
  const endTxt=!e?t('endRange'):Math.floor((en+1)/24)===Math.floor(st/24)?fmtH(e):`${fmtH(e)} (${dph(P,en+1)})`;
  const title=st===P.ni?t('rainNow',{e:endTxt}):t('rainAt',{d:dph(P,st),a:fmtH(T[st]),b:endTxt});
  return ['🌧️',title,t('rainMeta',{k:kmax,n:nn,s:fR(sum)})];
}

function practical(P){
  const T=P.H.time,out=[];
  const rs=i=>hourStats(P,i,'precipitation',0.2);
  const tm=i=>hourStats(P,i,'temperature_2m',-999).mean;
  const wn=i=>hourStats(P,i,'wind_speed_10m',-999).mean;
  const hr=i=>+T[i].slice(11,13);
  const base=hr(P.ni)<15?0:24,lab=base?t('tomorrow'):t('today');
  let maj=0,minr=0,wmax=0;
  for(let i=Math.max(P.ni,base+8);i<Math.min(base+17,T.length);i++){const s=rs(i);if(majority(s))maj++;else if(s.k>=1)minr++;wmax=Math.max(wmax,wn(i)||0)}
  out.push(['🧺',t('laundry'),...(maj?['lo',t('no'),t('laundryNo',{d:lab})]:
    minr?['md',t('maybe'),t('laundryMaybe',{d:lab})]:
    ['hi',t('yes'),t('laundryYes',{d:lab})+(wmax>=35?t('windyAdd'):'')])]);
  let best=-1,bs=1e9;
  for(let i=P.ni;i<Math.min(P.ni+24,T.length);i++){
    if(hr(i)<6||hr(i)>21)continue;const s=rs(i);if(majority(s))continue;
    const x=tm(i),w=wn(i)||0;if(x==null)continue;
    const sc=Math.abs(x-16)+w/4+(s.k?5:0);if(sc<bs){bs=sc;best=i}}
  out.push(['🏃',t('run'),...(best<0?['lo',t('no'),t('runNo')]:
    ['hi',t('yes'),t('runYes',{d:dph(P,best),t:fmtH(T[best]),v:fT(tm(best)),w:fW(wn(best)||0)})])]);
  let sum=0,mh=0;
  for(let i=P.ni;i<Math.min(P.ni+48,T.length);i++){sum+=hourStats(P,i,'precipitation',0).mean||0;if(majority(rs(i)))mh++}
  out.push(['🌱',t('garden'),...(sum>=5&&mh?['lo',t('no'),t('gardenNo',{v:fR(sum)})]:
    sum>=1?['md',t('little'),t('gardenLittle',{v:fR(sum)})]:
    ['hi',t('yes'),t('gardenYes')])]);
  return out;
}

function seriesRaw(P,m){const k=state.tab==='temp'?'temperature_2m':state.tab==='rain'?'precipitation':'wind_gusts_10m';return pick(P.H,k,m.id)||[]}
const conv=v=>v==null?null:state.tab==='temp'?cT(v):state.tab==='rain'?cR(v):cW(v);

function chart(P){
  const W=720,Hh=240,pl=34,pr=8,pt=12,pb=28;
  const N=P.H.time.length;
  const all=P.models.map(m=>seriesRaw(P,m).map(conv));
  const mean=P.H.time.map((_,i)=>{const v=all.map(a=>a[i]).filter(x=>x!=null);return v.length?avg(v):null});
  const vals=all.flat().filter(v=>v!=null);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(state.tab!=='temp'){lo=0;hi=Math.max(hi,state.tab==='rain'?cR(2):cW(30))}
  else{lo=Math.floor(lo-1);hi=Math.ceil(hi+1)}
  const x=i=>pl+(W-pl-pr)*i/(N-1);
  const y=v=>pt+(Hh-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let g='';
  for(let s=0;s<=4;s++){const v=lo+(hi-lo)*s/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#22305a" stroke-width="1"/><text x="${pl-5}" y="${y(v)+4}" fill="#8e9cc4" font-size="10" text-anchor="end">${state.tab==='rain'?(U.imp?Math.round(v*100)/100:r1(v)):Math.round(v)}</text>`}
  P.H.time.forEach((tm,i)=>{if(tm.endsWith('T00:00'))g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${Hh-pb}" stroke="#2c3c6c" stroke-dasharray="2 3"/>`;
    if(tm.endsWith('T12:00'))g+=`<text x="${x(i)}" y="${Hh-8}" fill="#8e9cc4" font-size="11" text-anchor="middle">${esc(dayShort(tm.slice(0,10),Math.floor(i/24)))}</text>`});
  g+=`<line x1="${x(P.ni)}" x2="${x(P.ni)}" y1="${pt}" y2="${Hh-pb}" stroke="#4f9cf9" stroke-width="1.5"/><text x="${x(P.ni)}" y="${pt+9}" fill="#4f9cf9" font-size="10" text-anchor="middle">${t('now')}</text>`;
  const path=a=>{let d='',on=false;a.forEach((v,i)=>{if(v==null){on=false;return}d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);on=true});return d};
  if(state.tab==='rain'){const bw=(W-pl-pr)/N;mean.forEach((v,i)=>{if(v&&v>cR(0.05))g+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" fill="#3b82f655"/>`})}
  const bst=bestId(),hl=bst&&P.models.length>1&&P.models.some(m=>m.id===bst);
  P.models.forEach((m,k)=>{if(m.id!==bst||!hl)g+=`<path d="${path(all[k])}" fill="none" stroke="${m.color}" stroke-width="${hl?1.3:1.6}" opacity="${hl?.55:.85}"/>`});
  if(hl){const k=P.models.findIndex(m=>m.id===bst);g+=`<path d="${path(all[k])}" fill="none" stroke="${P.models[k].color}" stroke-width="3.2"/>`}
  if(P.models.length>1)g+=`<path d="${path(mean)}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" style="direction:ltr">${g}</svg>`;
}

function hourly(P){
  const rows=[];
  for(let i=P.ni;i<Math.min(P.ni+48,P.H.time.length);i++){
    const tm=P.H.time[i];
    const raw=P.models.map(m=>seriesRaw(P,m)[i]);
    const ok=raw.filter(a=>a!=null);const mean=ok.length?avg(ok):null;
    const fmt=a=>a==null?'·':state.tab==='temp'?fT1(a):state.tab==='rain'?(a<0.05?'0':nR(a)):Math.round(cW(a));
    const hot=a=>{if(a==null)return '';if(state.tab==='rain'&&a>=1)return 'style="color:#93c5fd;font-weight:700"';if(state.tab==='gust'&&a>=50)return 'style="color:#fcd34d;font-weight:700"';return ''};
    const lbl=tm.endsWith('T00:00')?`<b>${esc(dayShort(tm.slice(0,10),Math.floor(i/24)))}</b> ${fmtH(tm)}`:fmtH(tm);
    rows.push(`<tr><td class="l">${lbl}</td>${raw.map(a=>`<td ${hot(a)}>${fmt(a)}</td>`).join('')}${P.models.length>1?`<td class="cons">${fmt(mean)}</td>`:''}</tr>`);
  }
  return `<table${P.models.length<=3?' style="min-width:0"':''}><tr><th class="l">${t('hourH')}</th>${P.models.map(m=>`<th${m.id===bestId()?' style="color:#fff"':''}><span class="dot" style="background:${m.color}"></span> ${m.id===bestId()&&P.models.length>1?'🏆 ':''}${m.name}</th>`).join('')}${P.models.length>1?`<th>${t('mean')}</th>`:''}</tr>${rows.join('')}</table>`;
}

// ===== מי המודל המדויק ביותר: בדיקה על 7 הימים האחרונים במקום הזה =====
// כל מודל נבדק לפי התחזית שנתן יום מראש (previous_day1) מול מה שקרה בפועל.
// "בפועל" = החציון של כל המודלים לאותה שעה אחרי מעשה (ניתוח עדכני), בשעות שכבר עברו.
async function fetchSkill(p){
  const key='mm_skill_'+p.lat.toFixed(1)+'_'+p.lon.toFixed(1);
  const c=load(key);
  if(c&&Date.now()-c.at<6*3600e3)return c.r;
  const ids=MODELS.map(m=>m.id).join(',');
  const u=`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${q2(p.lat)}&longitude=${q2(p.lon)}`+
    `&hourly=temperature_2m,temperature_2m_previous_day1&models=${ids}&past_days=7&forecast_days=1&timezone=auto`;
  try{
    const r=await fetch(u);if(!r.ok)return null;
    const res=skillCompute(await r.json());
    if(res)store(key,{at:Date.now(),r:res});
    return res;
  }catch(e){return null}
}
function skillCompute(d){
  const H=d&&d.hourly;if(!H||!H.time)return null;
  const nowLocal=new Date(Date.now()+(d.utc_offset_seconds||0)*1000).toISOString().slice(0,13);
  const ms=MODELS.map(m=>({m,a:pick(H,'temperature_2m',m.id),f:pick(H,'temperature_2m_previous_day1',m.id),e:[]}))
    .filter(x=>x.a&&x.f);
  if(ms.length<3)return null;
  for(let i=0;i<H.time.length;i++){
    if(H.time[i].slice(0,13)>=nowLocal)break;
    const act=ms.map(x=>x.a[i]).filter(v=>v!=null);
    if(act.length<3)continue;
    const truth=med(act);
    ms.forEach(x=>{const f=x.f[i];if(f!=null)x.e.push(f-truth)});
  }
  const out=ms.filter(x=>x.e.length>=48).map(x=>({id:x.m.id,mae:avg(x.e.map(Math.abs)),bias:avg(x.e),n:x.e.length}))
    .sort((a,b)=>a.mae-b.mae);
  return out.length>=3?{list:out,days:Math.round(Math.max(...out.map(x=>x.n))/24)}:null;
}
function skillHTML(s){
  if(!s)return `<h2>${t('skillTitle')}</h2><p class="sub">${t('skillNA')}</p>`;
  const top=MODELS.find(m=>m.id===s.list[0].id);
  const worst=s.list[s.list.length-1].mae||1;
  return `<h2>${t('skillTitle')}</h2>
    <p class="sub">${t('skillSub',{d:s.days})}</p>
    <div class="al green"><div style="font-size:22px">🏆</div><div><b>${t('skillBest',{m:top.name})}</b><span>${t('skillErr',{v:fDiff(s.list[0].mae)})}</span></div></div>
    ${s.list.map((x,i)=>{const m=MODELS.find(y=>y.id===x.id);const b=Math.abs(x.bias)>=0.5?(x.bias>0?t('skillWarm',{v:fDiff(x.bias)}):t('skillCold',{v:fDiff(-x.bias)})):'';
      return `<div class="qa"><div class="e">${i+1}</div><div><b><span class="dot" style="background:${m.color}"></span> ${m.name} <span dir="ltr">±${fDiff(x.mae)}</span></b>
      <div class="bar"><i style="width:${Math.max(8,Math.round((1-x.mae/(worst*1.15))*100))}%;background:${m.color}"></i></div>
      ${b?`<span class="t">${b}</span>`:''}</div></div>`}).join('')}
    <p class="sub" style="margin-top:8px;font-size:11.5px">${t('skillNote')}</p>`;
}

const norm=s=>(s||'').replace(/[֑-ׇ'"׳״\-\s()]/g,'').toLowerCase();
const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
// On-device place naming: no request containing the user's position is sent to any naming service.
let GEO=null,geoP=null;
function loadGeo(){
  if(GEO)return Promise.resolve(GEO);
  if(!geoP)geoP=fetch('geo/cities15000.json').then(r=>r.ok?r.json():null).then(j=>{GEO=Array.isArray(j)?j:null;if(!GEO)geoP=null;return GEO}).catch(()=>{geoP=null;return null});
  return geoP;
}
async function reverseName(lat,lon){
  const near=LANG==='he'&&nearestIn(CITIES,lat,lon).d<=4;
  const geo=near?null:await loadGeo(); // offline or missing file: falls back to the Hebrew list or "My location"
  return resolveName({lang:LANG,cities:CITIES,geo,lat,lon,t});
}
function getPos(timeout=12000){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{enableHighAccuracy:false,timeout,maximumAge:600000});
  });
}

function defaultList(){

  const pop=LANG==='he'?['פרדס חנה-כרכור','תל אביב-יפו','ירושלים','חיפה','באר שבע','אילת'].map(n=>{const c=CITIES.find(x=>x[0]===n);return {name:c[0],lat:c[1],lon:c[2],sub:c[3]+', ישראל'}}):[];
  const seen=new Set();return [...recent,...pop].filter(x=>{const k=norm(x.name)+Math.round(x.lat*10);if(seen.has(k))return false;seen.add(k);return true});

function renderList(items,q){

function localMatches(q){
  if(LANG!=='he')return [];
  const n=norm(q);if(!n)return [];
  const s=CITIES.filter(c=>norm(c[0]).startsWith(n)),inc=CITIES.filter(c=>!norm(c[0]).startsWith(n)&&norm(c[0]).includes(n));
  return [...s,...inc].slice(0,8).map(c=>({name:c[0],lat:c[1],lon:c[2],sub:c[3]+', ישראל'}));
}
async function search(q){
  const my=++qid;
  const loc=localMatches(q);
  renderList(loc,q);
  if(q.trim().length<2)return;
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=${LANG}&format=json`);
    const j=await r.json();if(my!==qid)return;
    const api=(j.results||[]).map(x=>({name:x.name,lat:x.latitude,lon:x.longitude,sub:[x.admin1,x.country].filter(Boolean).join(', ')}));
    const all=[...loc];
    api.forEach(a=>{if(!all.some(b=>norm(b.name)===norm(a.name)&&km(a.lat,a.lon,b.lat,b.lon)<5))all.push(a)});
    renderList(all.slice(0,12),q);
  }catch(e){}
}

}

const pushOK=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window)&&location.protocol==='https:';
function b64uToU8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}

async function sendSub(sub){
  const p=state.place;if(!p||!sub)return false;
  let tz='UTC';try{tz=(state.data&&state.data.timezone)||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){}
  const j=await postSub({action:'subscribe',subscription:sub.toJSON(),lat:q2(p.lat),lon:q2(p.lon),name:p.name,lang:LANG,imperial:U.imp,tz});
  if(j&&j.ok){store('mm_alerts_sync',{sig:syncSig(p),at:Date.now()});return true}
  return false;
}
const syncSig=p=>[q2(p.lat),q2(p.lon),p.name,LANG,U.imp?1:0].join('|');
async function alertsEnable(){
  if(!pushOK()){alertsMsg(t('alertsUnsupported'),1);return false}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){alertsMsg(t('alertsDenied'),1);return false}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){const k=await (await fetch(SUB_API+'?key=1')).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(k.key)})}
    if(!(await sendSub(sub)))throw new Error('server');
    if(load('mm_unsub_pending')===sub.endpoint)store('mm_unsub_pending',null); // re-enabled on the same subscription: nothing to delete
    store('mm_alerts',true);return true;
  }catch(e){alertsMsg(t('alertsErr'),1);return false}
}
// Turning alerts off must really delete the server copy. If the server cannot be reached, the endpoint is kept in
// mm_unsub_pending and the deletion is retried on every app start. The browser subscription is removed only after the server confirmed.
async function serverUnsub(endpoint){
  try{const j=await postSub({action:'unsubscribe',endpoint});return !!(j&&j.ok)}catch(e){return false}
}
async function alertsDisable(){
  store('mm_alerts',false);store('mm_alerts_sync',null);
  let done=true;
  try{
    const sub=await currentSub();
    if(sub){
      if(await serverUnsub(sub.endpoint)){store('mm_unsub_pending',null);await sub.unsubscribe()}
      else{store('mm_unsub_pending',sub.endpoint);done=false}
    }
  }catch(e){}
  return done;
}
async function alertsPending(){ // on startup: finish a deletion that failed earlier
  const ep=load('mm_unsub_pending');if(!ep||!pushOK())return;
  try{
    const sub=await currentSub();
    if(load('mm_alerts')&&sub&&sub.endpoint===ep){store('mm_unsub_pending',null);return}
    if(!(await serverUnsub(ep)))return;
    store('mm_unsub_pending',null);
    if(sub&&sub.endpoint===ep&&!load('mm_alerts'))await sub.unsubscribe();
  }catch(e){}
}
async function alertsSync(force){ // update location, language and units on the server when they changed, and at most once every 7 days otherwise (keeps the subscription from expiring)
  if(!load('mm_alerts'))return;
  const p=state.place;if(!p)return;
  const last=load('mm_alerts_sync');
  if(!force&&last&&last.sig===syncSig(p)&&Date.now()-last.at<7*864e5)return;
  try{const sub=await currentSub();if(sub)await sendSub(sub)}catch(e){}
}
async function sendTest(fresh){
  const b=$('#alertsTest');b.disabled=true;alertsMsg(t('aWorking'));
  try{
    let sub=await currentSub();
    if(!sub){if(!(await alertsEnable()))return;sub=await currentSub()}   // subscription was lost (e.g. after an app update): renew it
    let j=await postSub({action:'test',endpoint:sub.endpoint}).catch(()=>null);
    if(j&&j.error==='not_found'){await sendSub(sub);j=await postSub({action:'test',endpoint:sub.endpoint}).catch(()=>null)}
    if(j&&(j.status===404||j.status===410)){ // the push service dropped this subscription (common after an app reinstall/update): make a fresh one
      await postSub({action:'unsubscribe',endpoint:sub.endpoint}).catch(()=>{});
      try{await sub.unsubscribe()}catch(e){}
      if(!(await alertsEnable()))return;
      sub=await currentSub();j=sub?await postSub({action:'test',endpoint:sub.endpoint,retry:1}).catch(()=>null):null;
    }
    if(j&&j.ok)alertsMsg(t(fresh?'aOnSent':'aSent',{p:state.place?state.place.name:''}));
    else if(j&&j.error==='too_soon')alertsMsg(t('aTooSoon'),1);
    else alertsMsg(t('aFail')+(j&&j.status?` (${j.status})`:''),1);
  }catch(e){alertsMsg(t('aFail'),1)}
  finally{b.disabled=false}
}
async function alertsHeal(){ // on startup: if alerts are on but the phone lost its subscription, renew it quietly
  if(!load('mm_alerts')||!pushOK())return;
  try{if(await currentSub())return;
    if(Notification.permission==='granted'){await alertsEnable()}else{store('mm_alerts',false)}}catch(e){}
}
function alertsUI(){
  const on=!!load('mm_alerts');const tg=$('#alertsTgl');if(!tg)return;
  tg.checked=on;$('#alertsTest').hidden=!on;
  if(on&&state.place)alertsMsg(t('alertsOn',{p:state.place.name}));else if(!pushOK())alertsMsg(t('alertsUnsupported'),1);else alertsMsg('');
}

// ===== הגדרות =====
function openSettings(){
  const pl=load('mm_lang')||'auto',pu=load('mm_units')||'auto';
  $('#selLang').innerHTML=`<option value="auto">${t('langAuto')}</option>`+L.map(l=>`<option value="${l}">${LANG_NAMES[l]}</option>`).join('');
  $('#selUnits').innerHTML=`<option value="auto">${t('unitsAuto')}</option><option value="metric">${t('metric')}</option><option value="imperial">${t('imperial')}</option>`;
  $('#selLang').value=pl;$('#selUnits').value=pu;
  $('#ovS').classList.add('show');alertsUI();
}
function closeSettings(){$('#ovS').classList.remove('show')}

function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-tp]').forEach(el=>el.placeholder=t(el.dataset.tp));
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ta)));
  $('#credit').innerHTML=`<div class="made">👤 ${t('builtBy')}</div>
    <div style="margin-top:10px">${t('dataCredit',{l:'<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>'}).replace('CC BY 4.0','<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>')}</div>
    <div>${t('modNote')}</div>
    <div>${t('geoCredit').replace('CC BY 4.0','<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>')}</div>
    <div>${t('obsCredit')}</div><div>${t('imsDisc')}</div><div>${t('disclaimer')}</div><div><a class="pp" href="privacy.html">${t('privacy')}</a></div>`;
}

function rerenderAll(){
  applyPrefs();applyStatic();
  if(state.place)setLocUI(state.place);
  if(state.data)render();
}

function wire(){
  wireV2();
  $('#locBtn').addEventListener('click',openPicker);
  $('#close').addEventListener('click',closePicker);
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closePicker()});
  $('#q').addEventListener('input',e=>{
    selected=null;$('#confirm').classList.remove('show');
    clearTimeout(tmr);const v=e.target.value.trim();
    if(!v){renderList(defaultList(),'');return}
    tmr=setTimeout(()=>search(v),250);
  });
  $('#q').addEventListener('keydown',e=>{
    const opts=[...document.querySelectorAll('.opt')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!opts.length)return;
      active=(active+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;
      opts.forEach((o,i)=>o.classList.toggle('act',i===active));opts[active].scrollIntoView({block:'nearest'})}
    if(e.key==='Enter'){e.preventDefault();if(selected)return confirmSel();if(opts.length)choose(active>=0?+opts[active].dataset.i:+opts[0].dataset.i)}
    if(e.key==='Escape')closePicker();
  });
  $('#list').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)choose(+b.dataset.i)});
  $('#ok').addEventListener('click',confirmSel);
  $('#back').addEventListener('click',()=>{selected=null;$('#confirm').classList.remove('show');document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));$('#q').focus()});
  $('#geo').addEventListener('click',async()=>{
    const b=$('#geo');b.disabled=true;b.textContent=t('detecting');
    try{
      const c=await getPos();const name=await reverseName(c.latitude,c.longitude);
      selected={name,lat:+c.latitude.toFixed(2),lon:+c.longitude.toFixed(2),sub:t('detectedSub')};
      results=[selected];renderList(results,'x');choose(0);
    }catch(e){$('#list').innerHTML=`<div class="hint">${geoErrText(e)}</div>`}
    finally{b.disabled=false;b.textContent=t('detectBtn')}
  });
  $('#gear').addEventListener('click',openSettings);
  $('#closeS').addEventListener('click',closeSettings);
  $('#ovS').addEventListener('click',e=>{if(e.target.id==='ovS')closeSettings()});
  $('#selLang').addEventListener('change',e=>{store('mm_lang',e.target.value);rerenderAll();openSettings();alertsSync()});
  $('#selUnits').addEventListener('change',e=>{store('mm_units',e.target.value);rerenderAll();openSettings();alertsSync()});
  $('#alertsTgl').addEventListener('change',async e=>{
    const tg=e.target;tg.disabled=true;
    if(tg.checked){
      alertsMsg(t('aWorking'));
      const ok=await alertsEnable();tg.checked=ok;
      if(ok){$('#alertsTest').hidden=false;await sendTest(true)}
    }else{const ok=await alertsDisable();alertsMsg(t(ok?'aOff':'aOffPending'))}
    tg.disabled=false;
  });
  $('#alertsTest').addEventListener('click',()=>sendTest(false));
  $('#doneS').addEventListener('click',closeSettings);
}

// ===== הפעלה =====
async function init(){
  applyPrefs();applyStatic();wire();setTimeout(()=>alertsPending().then(alertsHeal),3000);
  const saved=load('mm_place');
  if(saved){
    go(saved);
    try{
      const st=navigator.permissions&&await navigator.permissions.query({name:'geolocation'});
      if(st&&st.state==='granted'){
        const c=await getPos(8000);
        if(km(c.latitude,c.longitude,saved.lat,saved.lon)>8){
          const name=await reverseName(c.latitude,c.longitude);
          showBanner(`<div class="txt">${t('movedQ',{p:esc(name)})}</div><button class="btn" id="bNo">${t('stay')}</button><button class="btn pri" id="bYes">${t('switchYes')}</button>`);
          $('#bYes').onclick=()=>{hideBanner();go({name,lat:+c.latitude.toFixed(2),lon:+c.longitude.toFixed(2),auto:true})};
          $('#bNo').onclick=hideBanner;
        }
      }
    }catch(e){}
    return;
  }
  $('#locName').textContent=t('locating');
  $('#app').innerHTML=`<div class="loading"><div class="spin"></div>${t('locating')}</div>`;
  try{
    const c=await getPos();
    const name=await reverseName(c.latitude,c.longitude);
    go({name,lat:+c.latitude.toFixed(2),lon:+c.longitude.toFixed(2),auto:true});
    showBanner(`<div class="txt">${t('detectedQ',{p:esc(name)})}</div><button class="btn" id="bChg">${t('otherPlace')}</button><button class="btn pri" id="bOk">${t('yesBtn')}</button>`);
    $('#bOk').onclick=hideBanner;$('#bChg').onclick=()=>{hideBanner();openPicker()};
  }catch(e){
    setLocUI(null);
    $('#app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:34px">📍</div><b>${t('cantLocate')}</b><p class="sub" style="margin:6px 0 12px">${e&&e.code===1?t('permShort'):t('geoNA')} ${t('pickFromList')}</p><button class="btn pri" id="pick">${t('pickTitle')}</button></div>`;
    $('#pick').onclick=openPicker;
  }
}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();

</script>
